services:
  app:
    build: .
    image: group2lexszyapp/grp2-notes-app:v1
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: notesdb
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
 
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: notesdb
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U appuser -d notesdb"]
      interval: 5s
      retries: 10
    restart: unless-stopped
 
volumes:
  db_data: