name: build-and-deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Notice we are pushing the unique Commit SHA and 'latest'
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/grp2-notes-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/grp2-notes-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to VM without SSH
        run: |
          az vm run-command invoke \
            -g "${{ secrets.AZURE_RG }}" \
            -n "${{ secrets.VM_NAME }}" \
            --command-id RunShellScript \
            --scripts "cd /opt/lexsy && \
              sudo sed -i 's|image: .*grp2-notes-app.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/grp2-notes-app:${{ github.sha }}|' docker-compose.yml && \
              sudo docker compose pull app && \
              sudo docker compose up -d --no-deps app && \
              sudo docker image prune -f"